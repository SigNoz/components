name: "Chromatic (main)"

on:
  pull_request:
    branches:
      - main
    types: [closed]
  # Manual run to seed or repair the `main` baseline. Only honoured on `main`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'update-visual-testing'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies and Build
        run: |
          pnpm install
          pnpm build

      - name: Run Chromatic
        uses: chromaui/action@v18.14.1
        # On `pull_request` the action reports the PR head commit and branch. A squash
        # merge leaves that commit unreachable from main, so the baseline lands under a
        # SHA later runs can't resolve and TurboSnap falls back to an ancient build.
        # Report the squash commit that actually landed on main, on main, instead.
        #
        # These must be action inputs, not `env`. The action overwrites the
        # CHROMATIC_BRANCH and CHROMATIC_SLUG environment variables with values from
        # the event payload; only CHROMATIC_SHA survives. See chromaui/action main.ts:
        #   process.env.CHROMATIC_BRANCH = branchName || branch;
        #   process.env.CHROMATIC_SLUG = repositorySlug || slug;
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          branchName: main
          repositorySlug: ${{ github.repository }}
          chromaticSha: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          autoAcceptChanges: main
          onlyChanged: true
          # The Storybook lives in `apps/docs`, but the action runs from the repo root and
          # never reads `apps/docs/chromatic.config.json`. Without this input the changed
          # files (repo-root paths) never match the stats file (paths relative to
          # `apps/docs`), and TurboSnap fails with "base directory is set correctly".
          # Leave `storybookConfigDir` unset: TurboSnap resolves it against this base dir,
          # so the default `.storybook` already points at `apps/docs/.storybook`.
          storybookBaseDir: apps/docs
          # Stories import `@signozhq/ui` from the built `packages/ui/dist`, which is not in
          # git, so a change under `packages/` traces to zero stories and would skip the
          # snapshots it affects. Snapshot everything when anything there changes.
          externals: |
            packages/**
