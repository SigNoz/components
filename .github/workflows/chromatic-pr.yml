name: "Chromatic (PR)"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name != 'update-visual-testing'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies and Build
        run: |
          pnpm install
          pnpm build

      - name: Run Chromatic
        uses: chromaui/action@v18.14.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          # The Storybook lives in `apps/docs`, but the action runs from the repo root and
          # never reads `apps/docs/chromatic.config.json`. Without this input the changed
          # files (repo-root paths) never match the stats file (paths relative to
          # `apps/docs`), and TurboSnap fails with "base directory is set correctly".
          # Leave `storybookConfigDir` unset: TurboSnap resolves it against this base dir,
          # so the default `.storybook` already points at `apps/docs/.storybook`.
          storybookBaseDir: apps/docs
          # Stories import `@signozhq/ui` from the built `packages/ui/dist`, which is not in
          # git, so a change under `packages/` traces to zero stories and would skip the
          # snapshots it affects. Snapshot everything when anything there changes.
          externals: |
            packages/**
          skip: ${{ !contains(github.event.pull_request.labels.*.name, 'run-visual-testing') }}

      - name: Mark PR as visually tested
        if: contains(github.event.pull_request.labels.*.name, 'run-visual-testing')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --add-label update-visual-testing --remove-label run-visual-testing
