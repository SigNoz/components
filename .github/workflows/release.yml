name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  # The packages we publish to npm. Keep in sync with `extra-files` in release-please-config.json.
  PUBLISH_FILTERS: "--filter=@signozhq/ui --filter=@signozhq/tailwind-config"

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        if: ${{ steps.release.outputs.release_created }}

      - name: Setup Node.js 24.x
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm turbo run build ${{ env.PUBLISH_FILTERS }}

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm -r publish --no-git-checks ${{ env.PUBLISH_FILTERS }}
        env:
          NPM_CONFIG_PROVENANCE: true
